[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmetadata-sqlmesh"
version = "0.1.0"
description = "Standalone SQLMesh metadata, lineage, and audit reporting for OpenMetadata"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Guillem Gimenez"}]
keywords = ["sqlmesh", "openmetadata", "lineage", "data-quality"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Database"]
dependencies = []

[project.optional-dependencies]
sqlmesh = ["sqlmesh>=0.231.1,<0.237"]
dev = ["pytest>=7.4", "build>=1.2", "ruff>=0.11"]

[project.scripts]
openmetadata-sqlmesh = "openmetadata_sqlmesh.cli:main"

[project.urls]
Repository = "https://github.com/sineline/openmetadata-sqlmesh-action"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/test_integration.py" = ["E402"]
